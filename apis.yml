aid: riverside
name: Riverside
description: >-
  Riverside is a professional podcast and video recording platform that enables remote studio-quality recording,
  AI-powered editing, and publishing. The Riverside Business API provides programmatic access to recordings,
  productions, studios, projects, exports, transcriptions, and webinar management for enterprise podcast production
  workflows. API access is available on Business plan only.
